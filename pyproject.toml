[project]
name = "multilingual-ui-translator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openpyxl>=3.1.5",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.0.0",
]

[tool.vercel]
entrypoint = "app.main:app"
